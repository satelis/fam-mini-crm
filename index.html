<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo base - Interface Homem-Maquina</title>

  <!-- =========================================================
       COMO USAR ESTE ARQUIVO (leia com calma)

       1. Salve este arquivo com o nome: index.html
       2. Para VER a tela: clique duas vezes no arquivo. Ele abre no navegador.
       3. Para EDITAR: abra com o Bloco de Notas, VS Code ou outro editor de texto.
       4. Voce so precisa mexer em duas partes:
            (A) a area de CORES, logo abaixo (dentro de <style>)
            (B) os TEXTOS e CAMPOS, mais para baixo (dentro de <body>)
          Cada parte que voce PODE mudar esta marcada com a expressao "MUDE AQUI".
       5. Salve o arquivo e atualize a pagina no navegador (tecla F5) para ver o resultado.

       Este modelo ja aplica varios principios da Aula 4. Procure no codigo os
       comentarios que comecam com PRINCIPIO: eles explicam qual diretriz esta
       sendo atendida. Voce deve manter esses principios na sua propria tela.
       ========================================================= -->

  <style>
    /* ---------- AREA DE CORES E ESTILO (A) - pode mudar a vontade ---------- */
    :root {
      --cor-principal: #008120;   /* MUDE AQUI: cor dos botoes e destaques */
      --cor-fundo:     #f1fff4;   /* MUDE AQUI: cor de fundo da tela */
      --cor-cartao:    #ffffff;   /* MUDE AQUI: cor do cartao central */
      --cor-texto:     #1b1f24;   /* MUDE AQUI: cor do texto */
      --cor-erro:      #b42318;   /* cor das mensagens de erro */
      --cor-sucesso:   #0f5132;   /* cor das mensagens de sucesso */
    }

    /* Daqui para baixo, mexa apenas se quiser. Nao e obrigatorio. */
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif; /* fonte legivel - PRINCIPIO: legibilidade */
      background: var(--cor-fundo);
      color: var(--cor-texto);
      margin: 0;
      min-height: 100vh;
      padding: 30px;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .dashboard{
      max-width: 1200px;
      margin: 0 auto;
    }
    .dashboard-cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 2px solid #d0d7de;
    } 
    .botaocliente {
      flex: none;
      background: var(--cor-principal);
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .botaocliente:hover {
      opacity: 0.9;
    }
    .cartao {
      background: var(--cor-cartao);
      width: 100%;
      max-width: 550px;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }
    h1 { font-size: 22px; margin: 0 0 4px;}
    .subtitulo { margin: 0 0 20px; color: #57606a; font-size: 14px; }
    .cabecalho-modal {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cabecalho-modal h1 {
      margin: 0;
    }
    .grid-clientes {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      min-height: calc(100vh - 150px); 
      align-content: start; 
    }
    .blob-cliente {
      background: #ffffff;
      border: 1px solid #d0d7de;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .cabecalho-blob {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }
    .cabecalho-blob h3 {
      margin: 0;
      color: #1b1f24; 
      font-size: 18px;
    }
    .botao-remover {
      flex: none;
      background: #b42318;
      color: white;
      border: none;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .botaoFecha {
      flex: none !important;
      border: none;
      color: rgb(156, 0, 0);
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      padding: 8px;
      background: transparent;
    }
    dialog {
      border: none;
      background: transparent;
      padding: 0;
      width: 100%;
      max-width: 550px;
    }

    dialog::backdrop {
      background: rgba(0,0,0,0.5);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 6px;
      font-size: 14px;
    }
    /* PRINCIPIO (Aula 4): rotulos claros no idioma do usuario, campos visiveis */
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus {
      outline: 2px solid var(--cor-principal); /* PRINCIPIO: visibilidade e reconhecimento */
      border-color: var(--cor-principal);
    }
    .dica { font-size: 12px; color: #57606a; margin-top: 4px; }

    .botoes { display: flex; gap: 10px; margin-top: 22px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .principal { background: var(--cor-principal); color: #fff; }
    /* PRINCIPIO (Aula 4): saida de emergencia - botao cancelar sempre visivel */
    .secundario { background: #eef1f5; color: var(--cor-texto); }

    .mensagem {
      display: none; 
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      text-align: center;
    }
    .mensagem.sucesso {
      display: block;
      background-color: #d1e7dd;
      color: var(--cor-sucesso);
      border: 1px solid #badbcc;
    }
    .mensagem.erro { color: var(--cor-erro); }
  </style>
</head>

<body>
  <!-- ================= AREA DE CONTEUDO (B) ================= -->
  <!-- Troque os textos entre as marcas MUDE AQUI pelo conteudo da SUA tela. -->
  
  
  <div class="dashboard">
    <header class="dashboard-cabecalho">
      <h1>CRM - ELO Coworking</h1>
      <button id="botao-novo-cliente" class="botaocliente">+ Cliente</button>
    </header>
    
    <!-- PRINCIPIO (Aula 4): projeto para erros - espaco reservado para feedback -->
    <p id="mensagem" class="mensagem"></p> 

    <div id="lista-clientes" class="grid-clientes">
    </div>
  </div>

  <dialog id="modal-cliente">
    
    <main class="cartao">
      <div class="cabecalho-modal">
        <h1>Adicionar um cliente</h1>
        <button id="botao-cancel-modal" class="botaoFecha">X</button>
      </div>

      <p class="subtitulo">Preencha os dados do cliente que deseja cadastrar</p>
      
      <form id="formulario">
  
        <!-- Cada campo tem: um rotulo, um campo e uma dica. Copie o bloco para criar mais campos. -->
        <label for="nome">Nome do Cliente</label>
        <input type="text" id="nome" placeholder="Ex: Sony" required>
  
        <label for="email"><!-- MUDE AQUI -->E-mail</label>
        <input type="email" id="email" placeholder="voce@exemplo.com" required>
        <p class="dica"><!-- MUDE AQUI -->E-mail de contato utilizado pela empresa.</p>
  
        <label for="relacionamento"><!-- MUDE AQUI -->Status de Relacionamento</label>
        <select id="relacionamento" required>
          <option value="" disabled selected>Selecione um status</option>
          <option value="lead">Lead (Primeiro contato)</option>
          <option value="ativo">Cliente ativo</option>
          <option value="inativo">Cliente inativo</option>
        </select>

        <label for="importancia"><!-- MUDE AQUI -->Nível de Importância</label>
        <select id="importancia" required>
          <option value="" disabled selected>Selecione um nível</option>
          <option value="baixo">Baixo</option>
          <option value="medio">Médio</option>
          <option value="importante">Alto</option>
        </select>
  
        <label for="dataultcont"><!-- MUDE AQUI -->Data de último contato</label>
        <input type="date" id="dataultcont" required>
  
        <label for="detaultloc"><!-- MUDE AQUI -->Data de última locação</label>
        <input type="date" id="detaultloc">
  
  
        <div class="botoes">
          <!-- PRINCIPIO (Aula 4): controle do usuario - acao principal e opcao de desfazer -->
          <button type="reset" class="secundario"><!-- MUDE AQUI -->Limpar</button>
          <button type="submit" class="principal"><!-- MUDE AQUI -->Cadastrar</button>
        </div>
  

      </form>
    </main>
  
  </dialog>
  
  

  <!-- ================= FEEDBACK SIMPLES (nao precisa mexer) =================
       Este trecho apenas mostra uma mensagem de sucesso ou erro ao enviar,
       para demonstrar o PRINCIPIO de "projeto para erros" e feedback ao usuario.
       Duplas do caminho VISUAL podem ignorar; duplas do caminho CODIGO podem
       melhorar as validacoes. -->
  <script>
    const modal = document.getElementById('modal-cliente');
    const btnNovoCliente = document.getElementById('botao-novo-cliente');
    const btnFechaModal = document.getElementById('botao-cancel-modal');

    btnNovoCliente.addEventListener('click', function() {
      modal.showModal();
    })

    btnFechaModal.addEventListener('click', function() {
      modal.close();
    })

    const form = document.getElementById('formulario');
    const listaClientes = document.getElementById('lista-clientes');
    const msg = document.getElementById('mensagem'); // Variável recuperada

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;

      const selectRelacionamento = document.getElementById('relacionamento');
      const textoRelacionamento = selectRelacionamento.options[selectRelacionamento.selectedIndex].text;

      const selectImportancia = document.getElementById('importancia');
      const valorImportancia = selectImportancia.value;
      const textoImportancia = selectImportancia.options[selectImportancia.selectedIndex].text;

      let iconeImportancia = '🟢';
      if (valorImportancia === 'medio') iconeImportancia = '🟡';
      if (valorImportancia === 'importante') iconeImportancia = '🔴';

      const formatarData = (dataOriginal) => {
        if (!dataOriginal) return 'Não informada';
        const partes = dataOriginal.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      };

      const dataContato = formatarData(document.getElementById('dataultcont').value);
      const dataLocacao = formatarData(document.getElementById('detaultloc').value);

      listaClientes.innerHTML = listaClientes.innerHTML + `
        <div class="blob-cliente">
          <div class="cabecalho-blob">
            <h3>${nome}</h3>
            <button class="botao-remover" onclick="if(confirm('Tem certeza que deseja apagar o cliente ${nome}?')) this.closest('.blob-cliente').remove()">Apagar</button>
          </div>
          <p><strong>E-mail:</strong> ${email}</p>
          <p><strong>Status:</strong> ${textoRelacionamento}</p>
          <p><strong>Importância:</strong> ${iconeImportancia} ${textoImportancia}</p>
          <p><strong>Último Contato:</strong> ${dataContato}</p>
          <p><strong>Última Locação:</strong> ${dataLocacao}</p>
        </div>
      `;

      modal.close();
      form.reset();

      //feedback da mensagem
      msg.textContent = 'Cliente adicionado com sucesso!';
      msg.className = 'mensagem sucesso';

      setTimeout(() => {
        msg.className = 'mensagem';
        msg.textContent = '';
      }, 3000);
    });
  </script>
</body>
</html>
